- id: lgmcts
  title: 'LGMCTS: Language-Guided Monte-Carlo Tree Search for Executable Semantic Object Rearrangement'
  venue: IROS, 2024
  description: Turning language instructions into executable object rearrangements through geometric reasoning
    and tree search.
  cv_highlights:
  - Co-developed ELGR-Bench and implemented language parsing, object selection, and evaluation for a planner
    that combines language guidance with Monte Carlo tree search.
  - Achieved 79.2% executable-plan success on ELGR-Bench and demonstrated language-guided rearrangement on UR5e.

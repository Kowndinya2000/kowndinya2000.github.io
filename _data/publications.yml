- id: ovsg
  title: Context-Aware Entity Grounding with Open-Vocabulary 3D Scene Graphs
  venue: CoRL, 2023
  description: Grounding free-form language queries in open-vocabulary 3D scene graphs.
  cv_highlights:
  - Built the DOVE-G benchmark and evaluation pipeline for grounding language in open-vocabulary 3D scene

- id: pl-mpc
  short_title: PL-MPC
  title: 'Beyond Policy Alignment: Closing the Planning–Learning Loop for Robot Control with Learned World
    Models'
  authors:
  - kowndinya
  - yuhan
  - abdeslam
  year: 2026
  venue: Under review
  status: under-review
  group: robotics
  description: Closing the loop between planning and learning for humanoid control and zero-shot sim-to-real
    manipulation.
  cv_highlights:
  - Combined uncertainty-aware MPPI planning with value learning and policy distillation using learned world models;
    improved mean return over the TD-M(PC)² baseline on the challenging HumanoidBench tasks balance-hard
    (98 to 387) and hurdle (199 to 466), using Unitree H1 in MuJoCo.
  - Demonstrated zero-shot sim-to-real transfer of a learned world model coupled with an MPPI planner
    from Isaac Gym to a KUKA IIWA14 for tool manipulation on a challenging wrench–nut alignment task.
  project_page: https://pl-mpc-humanoid.github.io/
  url: https://pl-mpc-humanoid.github.io/
  pub_link: https://arxiv.org/abs/2609.39751
  code: https://github.com/Kowndinya2000/pl-mpc
  image: assets/images/pl-mpc-architecture.webp
  image_full: assets/images/pl-mpc-architecture.webp
  image_alt: PL-MPC architecture showing planning, replay, world-model and value learning, and actor learning.
- id: trace
  short_title: TRACE
  prefix_title: false
  title: Plan-Conditioned Imitation for Robust Object Retrieval under Self-Occlusion in Dense Clutter
  authors:
  - kowndinya
  - ajinkya
  - abdeslam
  - jingjin
  year: 2026
  venue: Under review
  status: under-review
  group: robotics
  description: Retrieving objects from dense clutter despite camera occlusion, using plan-conditioned
    imitation learning.
  cv_highlights:
  - Developed a plan-conditioned imitation policy that rearranges dense clutter to create grasping clearance
    even when the robot’s arm blocks the camera’s view, with potential applications in bin picking and assembly-kit retrieval.
  - Achieved 90.7% retrieval success in Isaac Gym simulation and 90% after sim-to-real transfer to UR5e,
    cutting hardware task time by 65% versus the full-observation planner.
  project_page: https://trace-retrieval.github.io/
  url: https://trace-retrieval.github.io/
  pub_link: https://arxiv.org/abs/2609.38857
  code: https://github.com/Kowndinya2000/trace-code
  data: https://huggingface.co/datasets/Kowndi/trace
  image: assets/images/trace-architecture.webp
  image_full: assets/images/trace-architecture.webp
  image_alt: TRACE architecture showing the frozen teacher plan, partial observations, student memory, and push or grasp decision.
- id: karl
  title: 'KARL: Kalman-Filter Assisted Reinforcement Learner for Dynamic Object Tracking and Grasping'
  venue: IROS, 2025
  description: Tracking and grasping moving objects with reinforcement learning and Kalman filtering,
    including recovery from tracking loss and failed grasps.
  cv_highlights:
  - Combined curriculum reinforcement learning in Isaac Gym with Kalman-filter tracking for dynamic grasping
    and failure recovery through object reacquisition and grasp retries.
  - Demonstrated sim-to-real transfer to UR5e, achieving 93.3% grasp success in unobstructed scenes and
    80% with obstacles, outperforming [EARL](https://ieeexplore.ieee.org/document/10341988/) in both settings.
  image: images/karl.png
  pub_link: https://ieeexplore.ieee.org/abstract/document/11245879

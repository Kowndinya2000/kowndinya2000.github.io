  - jingjin
  year: 2025
  group: robotics
  status: published
  url: https://ieeexplore.ieee.org/abstract/document/11245879
  short_title: KARL
- id: dap
  title: 'DAP: Diffusion-based Affordance Prediction for Multi-modality Storage'
  venue: IROS, 2024
  description: Diffusion-based affordance prediction for placing objects in containers with different
    storage modes.
  cv_highlights:
  - Collected data and evaluated diffusion-based 6D object placement for storage tasks.
  - Achieved 98% book-shelving and 94% can-stacking success in simulation, outperforming the RPDiff placement baseline;
    demonstrated fruit storage on a KUKA IIWA14.

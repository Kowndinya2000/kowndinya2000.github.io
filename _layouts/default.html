<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.name }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.name }} · Robot learning &amp; manipulation">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/images/portrait.jpg' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/dm-sans.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=20260926-4">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrapper">
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/' | relative_url }}#research">Research</a>
      <a href="{{ '/' | relative_url }}#teaching">Teaching</a>
      <a class="nav-cv" href="{{ '/cv.html' | relative_url }}"{% if page.url == '/cv.html' %} aria-current="page"{% endif %}>CV <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main" class="wrapper">{{ content }}</main>
  <footer class="site-footer wrapper">
    <p>© {{ site.time | date: '%Y' }} {{ site.name }}<span class="site-updated">Website Last Updated: {{ site.last_updated }}</span></p>
    <div><a href="mailto:{{ site.email }}">Email</a><a href="https://linkedin.com/in/{{ site.linkedin_id }}">LinkedIn</a><a href="https://twitter.com/{{ site.twitter_username }}">X</a><a href="{{ '/credits.html' | relative_url }}">Site credits</a></div>
  </footer>
</body>
</html>
